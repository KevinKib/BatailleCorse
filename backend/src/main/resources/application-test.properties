# E2E test profile.
# Bullshit bots answer immediately so end-to-end runs are not slowed by their thinking time.
bullshit.bots.delay-min-ms=0
bullshit.bots.delay-max-ms=0
bullshit.bots.call-delay-min-ms=0
bullshit.bots.call-delay-max-ms=0
# Bataille Corse bots keep their real tier reaction times (400 to 2100 ms) so the timing matches the former
# local AI; only an extra delay on top of them can be tuned here if an end-to-end spec proves flaky.
bataillecorse.bots.extra-delay-ms=0
# Three Men's Morris bots answer immediately; their choices are fixed by the constant Morris generator.
threemenmorris.bots.delay-min-ms=0
threemenmorris.bots.delay-max-ms=0
# Kobo bots answer immediately and match at once; their forgetting uses a seeded generator.
kobo.bots.delay-min-ms=0
kobo.bots.delay-max-ms=0
kobo.bots.reaction-scale=0
# Mangola bots answer immediately and search no deeper than one ply (a zero budget completes only the first depth);
# their choices are fixed by the constant Mangola generator.
mangola.bots.delay-min-ms=0
mangola.bots.delay-max-ms=0
mangola.bots.think-ms=0
mangola.bots.layout-ms=0
# President bots answer immediately; their random choices use a seeded generator.
president.bots.delay-min-ms=0
president.bots.delay-max-ms=0
# ... except while a human out of turn holds the completion of the four: that window keeps its grace (spec section 10).
president.bots.completion-grace-ms=3000
# A dropped player forfeits after 5 s instead of 60 s, so a forfeit spec does not wait a real minute.
presence.forfeit-grace-seconds=5
