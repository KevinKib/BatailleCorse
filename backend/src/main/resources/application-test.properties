# E2E test profile.
# STOMP frames stay visible in the e2e logs (production logs them at INFO).
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG
# Bullshit bots answer immediately so end-to-end runs are not slowed by their thinking time.
bullshit.bots.delay-min-ms=0
bullshit.bots.delay-max-ms=0
bullshit.bots.call-delay-min-ms=0
bullshit.bots.call-delay-max-ms=0
# Bataille Corse bots keep their real tier reaction times (400 to 2100 ms) so the timing matches the former
# local AI; only an extra delay on top of them can be tuned here if an end-to-end spec proves flaky.
bataillecorse.bots.extra-delay-ms=0
# Three Men's Morris bots answer immediately; their choices are fixed by the constant Morris generator.
threemenmorris.bots.delay-min-ms=0
threemenmorris.bots.delay-max-ms=0
# Kobo bots answer immediately and match at once; their forgetting uses a seeded generator.
kobo.bots.delay-min-ms=0
kobo.bots.delay-max-ms=0
kobo.bots.reaction-scale=0
# Mangola bots answer immediately and search no deeper than one ply (a zero budget completes only the first depth);
# their choices are fixed by the constant Mangola generator.
mangola.bots.delay-min-ms=0
mangola.bots.delay-max-ms=0
mangola.bots.think-ms=0
# President bots answer immediately; their random choices use a seeded generator.
president.bots.delay-min-ms=0
president.bots.delay-max-ms=0
# ... except while a human out of turn holds the completion of the four: that window keeps its grace (spec section 10).
president.bots.completion-grace-ms=3000
# 99 bots answer immediately with a seeded generator, and the next round is dealt without a pause.
ninetynine.bots.delay-min-ms=0
ninetynine.bots.delay-max-ms=0
ninetynine.bots.seed=20261028
ninetynine.round-pause-ms=0
# Draughts bots answer immediately with a seeded generator; a zero search time makes the expert complete depth 1 only.
draughts.bots.delay-min-ms=0
draughts.bots.delay-max-ms=0
draughts.bots.think-ms=0
draughts.bots.seed=20261028
# Blackjack bots answer immediately with a seeded generator; nothing is scheduled between hands.
blackjack.bots.delay-min-ms=0
blackjack.bots.delay-max-ms=0
blackjack.bots.seed=20261028
# A dropped player forfeits after 30 s instead of 60 s: long enough that a page reload on a slow stack is not a
# departure. A spec that waits for a forfeit shortens it for its own game (PUT /api/test/presence/{gameId}/forfeit-grace).
presence.forfeit-grace-seconds=30
# Kilo de merde: no pass timer (a step waits for every seat), a 3 s race timeout, no pause between rounds, and bots that
# answer and slap immediately with a seeded generator.
kilodemerde.pass-timer-ms=0
kilodemerde.race-timeout-ms=3000
kilodemerde.round-pause-ms=0
kilodemerde.bots.pass-min-ms=0
kilodemerde.bots.pass-max-ms=0
kilodemerde.bots.easy.own-min-ms=0
kilodemerde.bots.easy.own-max-ms=0
kilodemerde.bots.easy.follow-min-ms=0
kilodemerde.bots.easy.follow-max-ms=0
kilodemerde.bots.medium.own-min-ms=0
kilodemerde.bots.medium.own-max-ms=0
kilodemerde.bots.medium.follow-min-ms=0
kilodemerde.bots.medium.follow-max-ms=0
kilodemerde.bots.hard.own-min-ms=0
kilodemerde.bots.hard.own-max-ms=0
kilodemerde.bots.hard.follow-min-ms=0
kilodemerde.bots.hard.follow-max-ms=0
kilodemerde.bots.seed=20261028
