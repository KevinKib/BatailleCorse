logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG
server.address=0.0.0.0
server.port=8080
# Usage statistics: Actuator metrics on their own port, which the gateway never proxies and docker-compose.prod.yml
# never publishes. Read from the server with `docker compose exec backend wget -qO- localhost:8081/actuator/metrics`.
# The tests set MANAGEMENT_PORT=0 (random port) so several Spring contexts never fight for 8081.
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,metrics
# Computer players of Bataille Corse rooms. The extra delay is added to each tier reaction time.
bataillecorse.bots.enabled=true
bataillecorse.bots.extra-delay-ms=0
