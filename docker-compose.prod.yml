# Production stack. The shared gateway (github.com/KevinKib/gateway) owns ports 80/443 and reaches
# the frontend and backend on the "web" network; nothing here publishes a port.
services:
  frontend:
    build:
      context: ./frontend
      target: prod
    image: bataillecorse-frontend:0.1
    restart: unless-stopped
    networks:
      default:
      web:
        aliases: [bataillecorse-frontend]

  backend:
    build:
      context: ./backend
      secrets:
        - maven_settings
    image: bataillecorse-backend:0.1
    restart: unless-stopped
    healthcheck:
      # Spring Boot's Tomcat only accepts TCP connections once the context is
      # fully started, so a successful connect means the app is ready to serve.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    networks:
      default:
      web:
        aliases: [bataillecorse-backend]

secrets:
  maven_settings:
    file: deploy/docker/settings.xml

networks:
  web:
    external: true
